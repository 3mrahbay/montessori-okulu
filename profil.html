<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Profilim — Montessori Okulu</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="profil.css">
</head>
<body data-tip="merakli">

<div id="yukleniyor"><div class="donen"></div> Profilin hazırlanıyor…</div>

<div class="duzen">
  <!-- YAN MENÜ -->
  <aside class="yan" id="yan">
    <a class="yan-logo" href="index.html" aria-label="Montessori Okulu ana sayfa">
      <div class="karolar">
        <div class="karo k-s">M</div><div class="karo k-b">O</div><div class="karo k-s">C</div>
      </div>
      <div>
        <span class="logo-ust">MONTESSORİ</span>
        <span class="logo-alt">ÜYE PANELİ</span>
      </div>
    </a>

    <div class="yan-kisi">
      <div class="avatar" id="avatar">?</div>
      <div style="min-width:0">
        <div class="kisi-ad" id="kisiAd">Üye</div>
        <div class="kisi-tip" id="kisiTip">Üye</div>
      </div>
    </div>

    <nav class="yan-nav" id="yanNav" aria-label="Profil menüsü"></nav>

    <div class="yan-alt">
      <a class="yan-link" href="index.html">
        <svg class="ik" aria-hidden="true"><use href="ikonlar.svg#ik-ev"/></svg> Ana Sayfa
      </a>
      <button class="yan-link" id="cikisDugme" type="button">
        <svg class="ik" aria-hidden="true"><use href="ikonlar.svg#ik-cikis"/></svg> Çıkış Yap
      </button>
    </div>
  </aside>
  <div class="karartma" id="karartma"></div>

  <!-- ANA ALAN -->
  <main class="ana">
    <div id="onizlemeSerit"></div>
    <header class="ust">
      <div class="ust-sol">
        <button class="menu-dugme" id="menuDugme" type="button" aria-label="Menüyü aç">
          <svg class="ik" aria-hidden="true"><use href="ikonlar.svg#ik-menu"/></svg>
        </button>
        <h1 class="ust-baslik" id="ustBaslik">Genel Bakış</h1>
      </div>
      <div id="ustEylem"></div>
    </header>
    <div class="icerik" id="icerik"></div>
  </main>
</div>

<div class="bildirim" id="bildirim"></div>

<script type="module" src="profil.js"></script>
</body>
</html>
