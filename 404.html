<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Sayfa bulunamadı — Montessori Okulu</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/topluluk.css">
<style>
.bulunamadi{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 20px}
.bulunamadi .mi{width:110px;height:110px;margin-bottom:18px}
.bulunamadi h1{font-family:var(--d);font-size:clamp(30px,4vw,44px);font-weight:600;margin-bottom:10px}
.bulunamadi p{color:var(--murekkep-o);font-size:16px;line-height:1.7;max-width:480px;margin:0 auto 24px}
.bulunamadi .dugmeler{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bulunamadi .dugme-hayalet{color:var(--murekkep);border:1.5px solid var(--cizgi);background:var(--beyaz)}
</style>
</head>
<body>
<main class="bulunamadi">
  <div>
    <svg class="mi" aria-hidden="true"><use href="/materyal-ikonlar.svg#m-silindir-blok"/></svg>
    <h1>Bu silindir yerine oturmadı.</h1>
    <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Montessori'de olduğu gibi: hata, doğru yeri bulmanın bir parçası.</p>
    <div class="dugmeler">
      <a class="dugme dugme-somon" href="/">Ana sayfa</a>
      <a class="dugme dugme-hayalet" href="/rehber">Rehberler</a>
      <a class="dugme dugme-hayalet" href="/topluluk">Topluluk</a>
    </div>
  </div>
</main>
</body>
</html>
